apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 16444
  podSubnet: 10.244.0.0/16
nodes:
  - extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
    role: control-plane
  - role: worker
