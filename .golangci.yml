version: "2"
linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
    gosec:
      excludes:
        - G204 # subprocess with variable args: we shell out to ssh/docker/kind by design; args are validated
        - G304 # file inclusion via variable: config/state paths are user-controlled by design
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, unused]
      - path: test/integration/
        linters: [gosec]
